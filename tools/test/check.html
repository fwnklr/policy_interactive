<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solver check</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 8px; border-bottom: 1px solid #ddd; text-align: left; }
  .fail { color: #b00020; font-weight: 600; }
</style>
</head>
<body>
<h1>JS solver vs. Python reference</h1>
<p id="summary">Running…</p>
<table id="tbl"><thead><tr>
  <th>model</th><th>vintage</th><th>policy</th><th>ELB</th><th>max |diff|</th><th>LCP</th><th>ms</th>
</tr></thead><tbody></tbody></table>
<script type="module">
import { loadMeta, loadModel, loadBaselines } from "../../web/js/data.js";
import { solve, baselineWindow, OUTPUT_VARS } from "../../web/js/solver.js";

const TOL = 1e-6;
const dir = "../../web/data";
const meta = await loadMeta(dir);
const baselines = await loadBaselines(dir, meta);
const ref = await (await fetch("reference.json")).json();
const labels = meta.vintages.map((v) => v.label);
const rows = [];
let worst = 0, nfail = 0, totalMs = 0;

for (const c of ref.cases) {
  const model = await loadModel(dir, meta, c.model);
  const n = labels.indexOf(c.vintage);
  const yb = baselineWindow(baselines[n], meta.vintages[n].t0, meta.T);
  const t = performance.now();
  const out = solve(model, yb, { type: c.policy, ...c.params }, { useElb: c.use_elb, elb: c.elb });
  const ms = performance.now() - t;
  totalMs += ms;
  let d = 0;
  for (const v of OUTPUT_VARS) for (let i = 0; i < meta.T; i++) d = Math.max(d, Math.abs(out.Y[v][i] - c.Y[v][i]));
  worst = Math.max(worst, d);
  const fail = !(d < TOL) || !out.lcp.converged;
  if (fail) nfail++;
  rows.push({ c, d, ms, lcp: out.lcp, fail });
}

document.querySelector("#tbl tbody").innerHTML = rows.map(({ c, d, ms, lcp, fail }) =>
  `<tr class="${fail ? "fail" : ""}"><td>${c.model}</td><td>${c.vintage}</td><td>${c.policy}:${c.name}</td>` +
  `<td>${c.use_elb ? c.elb : "off"}</td><td>${d.toExponential(2)}</td>` +
  `<td>${lcp.method}${lcp.bindingQuarters ? " (" + lcp.bindingQuarters + "q)" : ""}</td><td>${ms.toFixed(1)}</td></tr>`).join("");
const summary = `${ref.cases.length} cases, ${nfail} failures, worst |diff| = ${worst.toExponential(2)}, ` +
  `mean ${(totalMs / ref.cases.length).toFixed(1)} ms/solve`;
document.getElementById("summary").textContent = summary;
window.CHECK = { summary, nfail, worst, rows: rows.map((r) => ({ ...r, c: undefined, key: `${r.c.model} ${r.c.vintage} ${r.c.policy}:${r.c.name} ${r.c.use_elb ? r.c.elb : "off"}` })) };
</script>
</body>
</html>
